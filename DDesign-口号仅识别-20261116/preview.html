<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D-Design 本地规则预览</title><link rel="stylesheet" href="assets/brand/font-faces.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f6f6f3;color:#22272b;font:14px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1500px;margin:auto;padding:35px}h1{font-size:30px;margin:0 0 8px}p{color:#899198;margin:0 0 20px}.bar{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:25px 0}select{padding:9px 13px;border:1px solid #ddd;border-radius:8px;background:#fff;font:inherit}#status{font-size:12px;color:#929a9f}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:23px}article{background:#fff;border:1px solid #e7e9e3;border-radius:15px;overflow:hidden}.art{height:460px;padding:22px;background:#eeefea;display:flex;align-items:center;justify-content:center}.art svg{max-width:100%;max-height:100%;width:auto;height:auto}.meta{padding:19px}.meta b{display:block;font-size:15px}.meta small{display:block;color:#9ba4a9;margin-top:4px}.issues{font-size:11px;color:#bf8057;margin:12px 0 0;padding-left:15px}button{margin-top:14px;padding:8px 12px;border:1px solid #ff6600;border-radius:7px;color:#b34b06;background:#fff;font:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:default}.ok{font-size:11px;color:#6d8d62;margin-top:12px}.note{font-size:12px;color:#929d9f;margin-top:25px}@media(max-width:900px){.grid{grid-template-columns:1fr}.art{height:500px}main{padding:23px}.bar{gap:12px}}
</style></head><body><main><h1>D-Design 本地规则预览</h1><p>已实现的部分设计规则 · v0.3.2 · 草稿 · 主标题 65S / 副标题 50S · PNG 72 dpi</p><div class="bar"><label>图文占比 <select id="preset"><option value="S">S · 画面优先</option><option value="M" selected>M · 图文平衡</option><option value="L">L · 信息优先</option><option value="XL">XL · 全画面</option></select></label><label>品牌识别排列 <select id="pillar"><option value="horizontal">横向对齐</option><option value="vertical">竖向对齐</option></select></label><label>本次主视觉 <input id="main-image" type="file" accept="image/*"></label><span id="status"></span></div><div id="grid" class="grid"></div><p class="note">字体、图片和脚本均来自本地文件。本页没有 AI 服务、账号或审批功能；尺寸与具体排版参数仍需设计验收。成品统一 PNG、72 dpi；px 保留目标像素，mm 按 72 dpi 换算。原件保持不变，图片不叠加黑色蒙层。</p></main><script src="runtime/asset-registry.js"></script><script src="runtime/layout-rules.js"></script><script src="engine/didi-split-layout.js"></script><script src="engine/qr.js"></script><script src="engine/qr-markup.js"></script><script>
const DIDI_RULE_EXAMPLE={title:'活动主标题',subtitle:'活动副标题',date:'',location:'',url:'',customImage:'',splitPreset:'M',brandPillar:'horizontal',sizes:[{label:'竖版海报',w:1080,h:1440,unit:'px'},{label:'横版宣传图',w:1920,h:1080,unit:'px'},{label:'线下展架',w:800,h:1800,unit:'mm'}]};
document.getElementById('main-image').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;try{DIDI_RULE_EXAMPLE.customImage=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file);});refresh();}catch(error){document.getElementById('status').textContent='图片读取失败：'+error.message;}});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function refresh(){const d={...DIDI_RULE_EXAMPLE,splitPreset:document.getElementById('preset').value,brandPillar:document.getElementById('pillar').value};document.getElementById('status').textContent=DidiLayout.fontsReady?'实际字体已加载':'字体尚未加载，当前使用估算度量';document.getElementById('grid').innerHTML=d.sizes.map((s,index)=>{const p=DidiLayout.plan(d,s);let svg=DidiLayout.render(d,s,{qrMarkup});const errors=p.issues.filter(x=>x.severity==='error');return `<article><div class="art">${svg}</div><div class="meta"><b>${esc(s.label)}</b><small>${s.w} × ${s.h} ${s.unit} · ${d.splitPreset}</small>${errors.length?`<ul class="issues">${errors.map(e=>`<li>${esc(e.message)}</li>`).join('')}</ul>`:'<div class="ok">已实现的布局约束检查通过</div>'}<button data-export="${index}" ${errors.length||!DidiLayout.fontsReady?'disabled':''}>下载 PNG · 72 dpi</button></div></article>`;}).join('');}
document.getElementById('grid').addEventListener('click',async event=>{const button=event.target.closest('button[data-export]');if(!button)return;button.disabled=true;const label=button.textContent;button.textContent='正在导出…';try{const d={...DIDI_RULE_EXAMPLE,splitPreset:document.getElementById('preset').value,brandPillar:document.getElementById('pillar').value};const s=d.sizes[Number(button.dataset.export)];const bytes=await DidiLayout.exportPng(d,s,qrMarkup);const url=URL.createObjectURL(new Blob([bytes],{type:'image/png'}));const link=document.createElement('a');link.href=url;link.download=s.label+'-'+d.splitPreset+'-72dpi.png';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('status').textContent='已导出 PNG · 72 dpi';}catch(error){document.getElementById('status').textContent=error.message;}finally{button.disabled=false;button.textContent=label;}});
document.getElementById('preset').addEventListener('change',refresh);document.getElementById('pillar').addEventListener('change',refresh);refresh();DidiLayout.ready.then(refresh);
</script></body></html>
